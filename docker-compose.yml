version: '3.8'

services:
  dnsmasq:
    image: jpillora/dnsmasq
    container_name: dnsmasq-server
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "8080:8080"  # Web UI
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf
      - ./hosts:/etc/hosts
      - ./hosts.domain:/etc/hosts.domain
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  hosts-manager:
    build: .
    container_name: hosts-manager
    volumes:
      - ./hosts:/etc/hosts
    depends_on:
      - dnsmasq
    stdin_open: true
    tty: true

  domain-watcher:
    image: bash:latest
    container_name: domain-watcher
    volumes:
      - ./hosts:/app/hosts
      - ./hosts.domain:/app/hosts.domain
      - ./add_domain_suffix.sh:/app/add_domain_suffix.sh
    working_dir: /app
    command: ["bash", "/app/add_domain_suffix.sh", "--watch", "/app/hosts", ".rafael.local", "/app/hosts.domain"]
    restart: unless-stopped
    depends_on:
      - dnsmasq
