# Listen on all interfaces
listen-address=0.0.0.0

# Don't read /etc/resolv.conf
no-resolv

# Use Google DNS as upstream
server=8.8.8.8
server=8.8.4.4

# Read additional hosts from /etc/hosts
addn-hosts=/etc/hosts

# Read domain-suffixed hosts
addn-hosts=/etc/hosts.domain

# Don't forward plain names
domain-needed

# Log queries for debugging
log-queries

# Cache size
cache-size=1000

# Enable DHCP if needed (optional)
# dhcp-range=192.168.1.50,192.168.1.150,12h
